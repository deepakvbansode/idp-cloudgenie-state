apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: CloudGenieBlueprints
spec:
  destination:
    namespace: ""
    server: https://kubernetes.default.svc
  source:
    path: blueprints
    repoURL: " https://github.com/deepakvbansode/idp-cloudgenie-state.git"
    targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
