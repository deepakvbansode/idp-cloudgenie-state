apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-genie-blueprints
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - path: blueprints/api.cloudgenie.org/github-project
      repoURL: "https://github.com/deepakvbansode/idp-cloudgenie-state.git"
      targetRevision: HEAD
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
